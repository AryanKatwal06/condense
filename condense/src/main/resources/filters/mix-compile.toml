schema_version = 1
name = "mix-compile"
commands = ["mix compile"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "grouping"
pattern = "^(.*(error|Error|compilation failed).*)$"
include_other = false

[[tests]]
id = "keeps-signal"
input = """
error: undefined function invoice/0
"""
expected = """  error: undefined function invoice/0 : 1"""

[[tests]]
id = "garbage-falls-through"
input = "not a matching diagnostic line\n"
expected = ""
