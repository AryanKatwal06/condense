schema_version = 1
name = "grep"
commands = ["grep", "rg"]

# Small results pass through verbatim from GrepFilter so matched lines stay
# visible. Larger results prepend a count header and then use this bounded
# head/tail window (60 + 20 lines) with an explicit line-range omission marker.
[[stages]]
strategy = "head_tail"
head = 60
tail = 20

[[tests]]
id = "small-result-keeps-matched-lines"
input = "src/a.java: foo\nsrc/a.java: bar\nsrc/b.java: baz\n"
expected = "src/a.java: foo\nsrc/a.java: bar\nsrc/b.java: baz\n"
