schema_version = 1
name = "grep"
commands = ["grep", "rg"]

# GrepSummaryStage groups and bounds matches while keeping paths, line numbers,
# and matching code visible.
[[stages]]
strategy = "grep_summary"

[[tests]]
id = "small-result-keeps-matched-lines"
input = "src/a.java: foo\nsrc/a.java: bar\nsrc/b.java: baz\n"
expected = "src/a.java: foo\nsrc/a.java: bar\nsrc/b.java: baz\n"
