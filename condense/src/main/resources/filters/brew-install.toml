schema_version = 1
name = "brew-install"
commands = ["brew install"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "grouping"
pattern = "^(.*(Error|error|ERROR).*)$"
include_other = false

[[tests]]
id = "keeps-signal"
input = """
Error: invoice not found
"""
expected = """  Error: invoice not found : 1"""

[[tests]]
id = "garbage-falls-through"
input = "not a matching diagnostic line\n"
expected = ""
