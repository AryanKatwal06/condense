schema_version = 1
name = "uv-sync"
commands = ["uv sync"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "grouping"
pattern = "^(.*(error|Error|ERROR).*)$"
include_other = false

[[tests]]
id = "keeps-signal"
input = """
error: Failed to download invoice
"""
expected = """  error: Failed to download invoice : 1"""

[[tests]]
id = "garbage-falls-through"
input = "not a matching diagnostic line\n"
expected = ""
