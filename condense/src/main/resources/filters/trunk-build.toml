schema_version = 1
name = "trunk-build"
commands = ["trunk", "trunk check"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "grouping"
pattern = "^(.*(error|Error|ERROR).*)$"
include_other = false

[[tests]]
id = "keeps-signal"
input = """
error: invoice check failed
"""
expected = """  error: invoice check failed : 1"""

[[tests]]
id = "garbage-falls-through"
input = "not a matching diagnostic line\n"
expected = ""
