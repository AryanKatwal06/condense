schema_version = 1
name = "composer-install"
commands = ["composer install", "composer update"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "grouping"
pattern = "^(.*(error|Error|ERROR).*)$"
include_other = false

[[tests]]
id = "keeps-signal"
input = """
Your requirements could not be resolved Error invoice
"""
expected = """  Your requirements could not be resolved Error invoice : 1"""

[[tests]]
id = "garbage-falls-through"
input = "not a matching diagnostic line\n"
expected = ""
