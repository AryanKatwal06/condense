schema_version = 1
name = "yamllint"
commands = ["yamllint"]

[[stages]]
strategy = "aggregate_by_key"
key = "prefix_before_colon"
header = "{lines} issue(s) in {keys} file(s)"
top_n = 20

[[tests]]
id = "by-file"
input = """
src/a.py:1: error: Incompatible types
src/a.py:2: error: Missing argument
src/b.py:1: error: Name foo is not defined
"""
expected = "3 issue(s) in 2 file(s)\n  src/a.py: 2\n  src/b.py: 1"

[[tests]]
id = "garbage-falls-through"
input = "note: leftover"
expected = "1 issue(s) in 1 file(s)\n  note: 1"
