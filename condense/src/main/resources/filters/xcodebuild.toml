schema_version = 1
name = "xcodebuild"
commands = ["xcodebuild"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "grouping"
pattern = '^(.*(error:|BUILD FAILED).*)$'
include_other = false

[[tests]]
id = "keeps-signal"
input = """
** BUILD FAILED **
"""
expected = """  ** BUILD FAILED ** : 1"""

[[tests]]
id = "garbage-falls-through"
input = "not a matching diagnostic line\n"
expected = ""
