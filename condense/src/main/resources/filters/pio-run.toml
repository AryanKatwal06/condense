schema_version = 1
name = "pio-run"
commands = ["pio run"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "grouping"
pattern = "^(.*(error:|FAILED|Error).*)$"
include_other = false

[[tests]]
id = "keeps-signal"
input = """
error: 'invoice' was not declared
"""
expected = """  error: 'invoice' was not declared : 1"""

[[tests]]
id = "garbage-falls-through"
input = "not a matching diagnostic line\n"
expected = ""
