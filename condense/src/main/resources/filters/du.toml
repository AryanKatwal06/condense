schema_version = 1
name = "du"
commands = ["du"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "tail_lines"
max_lines = 8
skip_blank = true

[[tests]]
id = "error-tail"
input = """
progress 1
progress 2
progress 3
progress 4
progress 5
progress 6
progress 7
progress 8
progress 9
progress 10
progress 11
progress 12
ERROR last
"""
expected = "... (showing last 8 of 13 lines)\nprogress 6\nprogress 7\nprogress 8\nprogress 9\nprogress 10\nprogress 11\nprogress 12\nERROR last"

[[tests]]
id = "garbage-falls-through"
input = "one line\n"
expected = "one line"
