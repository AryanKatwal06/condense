schema_version = 1
name = "docker-build"
commands = ["docker build"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "docker_build_summary"

[[tests]]
id = "tagged"
input = "Successfully built abcdef12\nSuccessfully tagged app:latest\n"
expected = "✓ docker build: abcdef12 → app:latest"

[[tests]]
id = "steps-then-summary"
input = "#1 DONE 0.1s\nSuccessfully built abcdef12\nSuccessfully tagged app:latest\n"
expected = "#1 DONE 0.1s\n✓ docker build: abcdef12 → app:latest"
