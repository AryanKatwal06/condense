schema_version = 1
name = "msbuild"
commands = ["msbuild", "dotnet msbuild"]
select_input = "stdout_then_stderr"

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "msbuild_binlog"

[[stages]]
strategy = "grouping"
pattern = "^(.*(?:error CS[0-9]+|Build FAILED|Build succeeded).*)$"
include_other = false

[[tests]]
id = "build-failed"
input = "  Determining projects to restore...\nBuild FAILED.\n"
expected = "  Build FAILED. : 1"

[[tests]]
id = "garbage-falls-through"
input = "not a binlog and not a compiler error\n"
expected = ""
