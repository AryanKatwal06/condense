schema_version = 1
name = "find"
commands = ["find"]

# FindSummaryStage preserves visible paths, bounds large result sets, and
# appends an extension breakdown.
[[stages]]
strategy = "find_summary"

[[tests]]
id = "small-result-keeps-paths"
input = "src/a.java\nsrc/b.java\nREADME\n"
expected = "src/a.java\nsrc/b.java\nREADME\n"
