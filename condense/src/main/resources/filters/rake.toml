schema_version = 1
name = "rake"
commands = ["rake"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "grouping"
pattern = "^(.*(rake aborted|error|Error|ERROR).*)$"
include_other = false

[[tests]]
id = "keeps-signal"
input = """
rake aborted!
"""
expected = """  rake aborted! : 1"""

[[tests]]
id = "garbage-falls-through"
input = "not a matching diagnostic line\n"
expected = ""
