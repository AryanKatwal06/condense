schema_version = 1
name = "gcloud"
commands = ["gcloud"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "grouping"
pattern = "^(.*(ERROR|Error).*)$"
include_other = false

[[tests]]
id = "keeps-signal"
input = """
ERROR: (gcloud) invoice failed
"""
expected = """  ERROR: (gcloud) invoice failed : 1"""

[[tests]]
id = "garbage-falls-through"
input = "not a matching diagnostic line\n"
expected = ""
