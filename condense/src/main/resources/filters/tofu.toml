schema_version = 1
name = "tofu"
commands = ["tofu plan", "tofu apply", "tofu destroy", "tofu init", "tofu validate"]
select_input = "stdout_then_stderr"

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "machine_ui"

[[stages]]
strategy = "validate_json"

[[stages]]
strategy = "grouping"
pattern = "^(.*(Error|Plan:|will be created|will be destroyed|will be updated|successfully initialized|Success! The configuration is valid).*)$"
include_other = false

[[tests]]
id = "plan-json"
input = """
{"@module":"terraform.ui","type":"version","ui":"1.0"}
{"@module":"terraform.ui","type":"planned_change","change":{"resource":{"addr":"aws_instance.web","resource_type":"aws_instance"},"action":"create"}}
{"@module":"terraform.ui","type":"change_summary","changes":{"add":1,"change":0,"remove":0}}
"""
expected = "Plan: 1 to add, 0 to change, 0 to destroy\naws_instance.web create"
