schema_version = 1
name = "swift-build"
commands = ["swift build"]

[[stages]]
strategy = "ansi_strip"

[[stages]]
strategy = "grouping"
pattern = "^(.*(error:|Error).*)$"
include_other = false

[[tests]]
id = "keeps-signal"
input = """
error: cannot find Invoice in scope
"""
expected = """  error: cannot find Invoice in scope : 1"""

[[tests]]
id = "garbage-falls-through"
input = "not a matching diagnostic line\n"
expected = ""
