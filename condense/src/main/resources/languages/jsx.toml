schema_version = 1
name = "jsx"
extensions = [".jsx"]
family = "c_like"
line_comment = "//"
block_comment_start = "/*"
block_comment_end = "*/"
nest_block_comments = false
raw_strings = "js_template"

[[strings]]
delimiter = "\""
escape = "\\"

[[strings]]
delimiter = "'"
escape = "\\"

[[outline]]
name = "function"
regex = '''^\s*(export\s+)?(async\s+)?function\b'''

[[outline]]
name = "export"
regex = '''^\s*export\b'''

[[tests]]
id = "keeps-star-in-string"
level = "comments"
input = """
const glob = "src/**/*";
/* gone */
export function App() { return null; }
"""
expected_contains = ["src/**/*", "export function App()"]
expected_absent = ["gone"]
