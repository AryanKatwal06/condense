schema_version = 1
name = "python"
extensions = [".py", ".pyw"]
family = "hash"
line_comment = "#"
nest_block_comments = false
raw_strings = "python"

[[strings]]
delimiter = "\""
escape = "\\"

[[strings]]
delimiter = "'"
escape = "\\"

[[outline]]
name = "def"
regex = '''^\s*(async\s+)?def\b'''

[[outline]]
name = "class"
regex = '''^\s*class\b'''

[[tests]]
id = "hash-in-string"
level = "comments"
input = """
url = "http://example.com#frag"
# drop this
x = 1
"""
expected_contains = ["http://example.com#frag", "x = 1"]
expected_absent = ["drop this"]
