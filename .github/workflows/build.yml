name: Build & Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  jvm-test:
    name: JVM Tests (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: condense
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1.5.6
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build and test (JVM mode)
        run: mvn verify --no-transfer-progress -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-jvm
          path: condense/target/surefire-reports/
          retention-days: 7


  native-builds:
    name: Native Image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: jvm-test
    defaults:
      run:
        working-directory: condense
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: condense-linux-x64-dynamic
            binary-name: condense-runner
            install-musl: true
          - os: ubuntu-24.04-arm
            artifact-name: condense-linux-aarch64
            binary-name: condense-runner
          - os: windows-latest
            artifact-name: condense-windows-x64
            binary-name: condense-runner.exe
          - os: macos-15 # Pinned to avoid silent macOS 26 migration — update intentionally after testing
            artifact-name: condense-macos-arch
            binary-name: condense-runner
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          echo INCLUDE=%INCLUDE%>> %GITHUB_ENV%
          echo LIB=%LIB%>> %GITHUB_ENV%
          echo PATH=%PATH%>> %GITHUB_ENV%

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1.5.6
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install musl toolchain and zlib (linux-x64 only)
        if: matrix.install-musl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          curl -L -o zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          mkdir zlib && tar -xzf zlib.tar.gz -C zlib --strip-components 1
          cd zlib
          CC=musl-gcc ./configure --static --prefix=/usr/local/musl
          make
          sudo make install
          echo "C_INCLUDE_PATH=/usr/local/musl/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/usr/local/musl/lib" >> $GITHUB_ENV

      - name: Check Java and OS Arch Properties
        run: java -XshowSettings:properties -version

      - name: Check Active Maven Profiles
        run: mvn help:active-profiles -B

      - name: Build native image
        shell: bash
        run: mvn package -Pnative -DskipTests -Dquarkus.native.native-image-xmx=5g --no-transfer-progress -B

      - name: Verify no fallback
        shell: bash
        run: |
          if grep -q "fallback" target/native.log 2>/dev/null; then
            echo "ERROR: native image fell back to JVM mode"
            exit 1
          fi
          echo "✓ Native image built without fallback"

      - name: Native integration tests
        shell: bash
        run: |
          mvn failsafe:integration-test failsafe:verify \
            -DskipITs=false \
            -Dnative.image.path="${PWD}/target/condense-runner" \
            --no-transfer-progress -B

      - name: Enforce uncompressed binary size ceiling
        shell: bash
        run: |
          CEILING=83886080
          BINARY="target/${{ matrix.binary-name }}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            SIZE=$(stat -f%z "$BINARY")
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            SIZE=$(powershell -NoProfile -Command "(Get-Item '$BINARY').Length")
          else
            SIZE=$(stat -c%s "$BINARY")
          fi
          echo "Uncompressed binary size: $SIZE bytes (ceiling $CEILING = 80 MiB)"
          if [ "$SIZE" -gt "$CEILING" ]; then
            echo "FAIL: uncompressed native image is $SIZE bytes, exceeds ceiling of $CEILING (80 MiB)"
            exit 1
          fi

      - name: Smoke tests (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/${{ matrix.binary-name }} --version
          ./target/${{ matrix.binary-name }} --help
          echo "Exit code test:"
          ./target/${{ matrix.binary-name }} sh -c "exit 42" || echo "Exit: $?"
          ./target/${{ matrix.binary-name }} git status || true

          # Structural assertion: gain must track commands
          GAIN_JSON=$(./target/${{ matrix.binary-name }} gain --format json)
          echo "$GAIN_JSON"
          TOTAL=$(echo "$GAIN_JSON" | grep '"total_commands"' | tr -dc '0-9')
          if [ -z "$TOTAL" ] || [ "$TOTAL" -lt 1 ]; then
            echo "FAIL: gain reported total_commands='$TOTAL', expected >= 1"
            echo "Full output: $GAIN_JSON"
            exit 1
          fi
          echo "PASS: gain reports total_commands=$TOTAL"

          # 1. Non-interactive purge guard test (must fail with exit code 1 when --yes is missing)
          echo "Testing non-interactive refusal guard..."
          if ./target/${{ matrix.binary-name }} uninstall --purge; then
            echo "FAIL: Expected non-interactive purge without --yes to fail"
            exit 1
          else
            echo "PASS: Non-interactive purge correctly refused"
          fi

          # 2. Package manager detection test (simulate Homebrew cellar path)
          echo "Testing package manager detection..."
          mkdir -p /tmp/fake-brew/opt/homebrew/Cellar/condense/1.0.1/bin
          cp ./target/${{ matrix.binary-name }} /tmp/fake-brew/opt/homebrew/Cellar/condense/1.0.1/bin/condense
          chmod +x /tmp/fake-brew/opt/homebrew/Cellar/condense/1.0.1/bin/condense
          PM_OUT=$(/tmp/fake-brew/opt/homebrew/Cellar/condense/1.0.1/bin/condense uninstall)
          echo "$PM_OUT"
          if echo "$PM_OUT" | grep -q "brew uninstall condense"; then
            echo "PASS: Homebrew detection and redirection succeeded"
          else
            echo "FAIL: Homebrew detection failed"
            exit 1
          fi
          if [ ! -f /tmp/fake-brew/opt/homebrew/Cellar/condense/1.0.1/bin/condense ]; then
            echo "FAIL: Binary under Homebrew was deleted, expected refusal"
            exit 1
          fi
          rm -rf /tmp/fake-brew

          # 3. End-to-end native uninstall purge and self-deletion
          echo "Testing end-to-end native uninstall purge and self-deletion..."
          DISPOSABLE_DIR=$(mktemp -d)
          cp ./target/${{ matrix.binary-name }} "$DISPOSABLE_DIR/condense"
          chmod +x "$DISPOSABLE_DIR/condense"

          "$DISPOSABLE_DIR/condense" git status || true

          UNINSTALL_OUT=$("$DISPOSABLE_DIR/condense" uninstall --purge --yes)
          echo "$UNINSTALL_OUT"

          if [ -f "$DISPOSABLE_DIR/condense" ]; then
            echo "FAIL: Binary was not self-deleted"
            exit 1
          fi
          echo "PASS: Binary was self-deleted"
          rm -rf "$DISPOSABLE_DIR"

      - name: Smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\${{ matrix.binary-name }} --version
          .\target\${{ matrix.binary-name }} --help
          Write-Host "Exit code test:"
          .\target\${{ matrix.binary-name }} cmd /c "exit 42" ; Write-Host "Exit: $LASTEXITCODE"
          .\target\${{ matrix.binary-name }} git status

          # Structural assertion: gain must track commands
          $gainJson = .\target\${{ matrix.binary-name }} gain --format json | Out-String
          Write-Host $gainJson
          $gain = $gainJson | ConvertFrom-Json
          if ($gain.total_commands -lt 1) {
            Write-Error "FAIL: gain reported total_commands=$($gain.total_commands), expected >= 1"
            exit 1
          }
          Write-Host "PASS: gain reports total_commands=$($gain.total_commands)"

          # 1. Non-interactive purge guard test (must fail with exit code 1 when --yes is missing)
          Write-Host "Testing non-interactive refusal guard..."
          $refused = $false
          try {
            & .\target\${{ matrix.binary-name }} uninstall --purge
            if ($LASTEXITCODE -ne 0) { $refused = $true }
          } catch {
            $refused = $true
          }
          if (-not $refused -and $LASTEXITCODE -eq 0) {
            Write-Error "FAIL: Expected non-interactive purge without --yes to fail"
            exit 1
          }
          Write-Host "PASS: Non-interactive purge correctly refused"

          # 2. Package manager detection test (simulate Scoop path)
          Write-Host "Testing package manager detection..."
          $fakeScoopDir = Join-Path $env:TEMP "fake-scoop\scoop\apps\condense\1.0.1"
          New-Item -ItemType Directory -Force -Path $fakeScoopDir | Out-Null
          $fakeScoopBin = Join-Path $fakeScoopDir "condense.exe"
          Copy-Item .\target\${{ matrix.binary-name }} $fakeScoopBin -Force
          $pmOut = & $fakeScoopBin uninstall | Out-String
          Write-Host $pmOut
          if ($pmOut -notlike "*scoop uninstall condense*") {
            Write-Error "FAIL: Scoop detection failed"
            exit 1
          }
          if (-not (Test-Path $fakeScoopBin)) {
            Write-Error "FAIL: Binary under Scoop was deleted, expected refusal"
            exit 1
          }
          Write-Host "PASS: Scoop detection and redirection succeeded"
          Remove-Item -Recurse -Force (Join-Path $env:TEMP "fake-scoop") -ErrorAction SilentlyContinue

          # 3. End-to-end native uninstall purge and self-deletion on Windows
          Write-Host "Testing end-to-end native uninstall purge and self-deletion..."
          $dispDir = Join-Path $env:TEMP "disp-condense-$([guid]::NewGuid().Guid)"
          New-Item -ItemType Directory -Force -Path $dispDir | Out-Null
          $dispBin = Join-Path $dispDir "condense.exe"
          Copy-Item .\target\${{ matrix.binary-name }} $dispBin -Force

          & $dispBin git status

          $uninstOut = & $dispBin uninstall --purge --yes | Out-String
          Write-Host $uninstOut

          Start-Sleep -Seconds 3
          if (Test-Path $dispBin) {
            Write-Error "FAIL: Windows binary was not deleted after self-deletion"
            exit 1
          }
          Write-Host "PASS: Windows binary was successfully self-deleted"
          Remove-Item -Recurse -Force $dispDir -ErrorAction SilentlyContinue

      - name: Measure native binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY=target/${{ matrix.binary-name }}
          chmod +x "$BINARY"

          echo "== Binary size =="
          ls -lh "$BINARY"

          echo "== Cold start (5 runs of --version) =="
          for i in $(seq 1 5); do
            START=$(date +%s%N)
            "$BINARY" --version > /dev/null
            END=$(date +%s%N)
            echo "Run $i: $(( (END - START) / 1000000 ))ms"
          done

      - name: Emit metrics as annotations
        if: always()
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pwsh -Command "\$BINARY = '.\target\${{ matrix.binary-name }}'; \$size = (Get-Item \$BINARY).Length ; Write-Host \"::notice::Windows uncompressed binary size: \$size bytes\" ; for (\$i = 1; \$i -le 5; \$i++) { \$sw = [Diagnostics.Stopwatch]::StartNew(); & \$BINARY --version > \$null; \$sw.Stop(); Write-Host \"::notice::Windows Cold Start Run \${i}: \$(\$sw.ElapsedMilliseconds)ms\" }"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            size=$(stat -f%z target/${{ matrix.binary-name }})
            echo "::notice::macOS uncompressed binary size: $size bytes"
            ruby -e "5.times { |i| start = Process.clock_gettime(Process::CLOCK_MONOTONIC, :millisecond); system('./target/${{ matrix.binary-name }} --version > /dev/null'); puts %Q(::notice::macOS Cold Start Run #{i+1}: #{Process.clock_gettime(Process::CLOCK_MONOTONIC, :millisecond) - start}ms) }"
          else
            size=$(stat -c%s target/${{ matrix.binary-name }})
            echo "::notice::Linux uncompressed binary size: $size bytes"
            for i in $(seq 1 5); do START=$(date +%s%N); target/${{ matrix.binary-name }} --version > /dev/null; END=$(date +%s%N); echo "::notice::Linux Cold Start Run $i: $(( (END - START) / 1000000 ))ms"; done
          fi

      - name: Upload native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: condense/target/${{ matrix.binary-name }}
          retention-days: 3

      - name: Push metrics
        if: always()
        shell: bash
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git fetch origin
          # Create or checkout the metrics branch
          git checkout -B ci-metrics
          
          # Append metrics
          echo "=== Metrics for ${{ matrix.os }} ===" > metrics-${{ matrix.os }}.txt
          echo "Active profiles:" >> metrics-${{ matrix.os }}.txt
          mvn help:active-profiles -B >> metrics-${{ matrix.os }}.txt || true
          
          echo "Cold start and binary size:" >> metrics-${{ matrix.os }}.txt
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pwsh -Command "\$BINARY = '.\target\${{ matrix.binary-name }}'; Get-Item \$BINARY | Select-Object Length ; for (\$i = 1; \$i -le 5; \$i++) { \$sw = [Diagnostics.Stopwatch]::StartNew(); & \$BINARY --version > \$null; \$sw.Stop(); Write-Host \"Run \${i}: \$(\$sw.ElapsedMilliseconds)ms\" }" >> metrics-${{ matrix.os }}.txt || true
          else
            ls -lh target/${{ matrix.binary-name }} >> metrics-${{ matrix.os }}.txt || true
            for i in $(seq 1 5); do START=$(date +%s%N); target/${{ matrix.binary-name }} --version > /dev/null; END=$(date +%s%N); echo "Run $i: $(( (END - START) / 1000000 ))ms"; done >> metrics-${{ matrix.os }}.txt || true
          fi
          
          git add metrics-${{ matrix.os }}.txt
          git commit -m "Add metrics for ${{ matrix.os }}" || true
          # Pull with rebase in case other matrix jobs pushed
          git pull --rebase origin ci-metrics || true
          git push origin ci-metrics || true
