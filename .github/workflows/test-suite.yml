name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-tests:
    name: JVM Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: condense
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: condense/pom.xml

      - name: Run Maven test suite
        run: ./mvnw test --no-transfer-progress -B

      - name: Publish Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-results
          path: condense/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
