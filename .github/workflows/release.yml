name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Condense ${{ github.ref_name }}"
          body: |
            ## Condense ${{ github.ref_name }}

            ${{ steps.changelog.outputs.NOTES }}

            ## Installation

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            Or download the binary for your platform below and verify the SHA-256 checksum in `checksums.txt`.
            All binaries are signed via Sigstore/cosign. You can verify provenance with:
            ```bash
            cosign verify-blob --certificate-identity-regexp "https://github.com/.*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --signature <binary>.sig <binary>
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}


  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: create-release
    defaults:
      run:
        working-directory: condense

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            native_args: "--no-fallback"
            binary_suffix: ""
            sha_cmd: "sha256sum"

          - os: ubuntu-24.04-arm
            target: linux-aarch64
            native_args: "--no-fallback"
            binary_suffix: ""
            sha_cmd: "sha256sum"

          - os: macos-15 # Pinned to avoid silent macOS 26 migration — update intentionally after testing
            target: macos-aarch64
            native_args: "--no-fallback"
            binary_suffix: ""
            sha_cmd: "shasum -a 256"

          - os: windows-latest
            target: windows-x64
            native_args: "--no-fallback"
            binary_suffix: ".exe"
            sha_cmd: "certutil -hashfile"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          echo INCLUDE=%INCLUDE%>> %GITHUB_ENV%
          echo LIB=%LIB%>> %GITHUB_ENV%
          echo PATH=%PATH%>> %GITHUB_ENV%

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1.5.6
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-${{ matrix.target }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-maven-
            ${{ runner.os }}-maven-

      - name: Build native image
        shell: bash
        run: |
          mvn package -Pnative -DskipTests \
            -Dquarkus.native.native-image-xmx=5g \
            -Dquarkus.native.additional-build-args="${{ matrix.native_args }}" \
            --no-transfer-progress -B

      - name: Native integration tests
        shell: bash
        run: |
          SOAK="${{ matrix.target == 'linux-x64' && '300' || '20' }}"
          echo "condense.soak.runs=$SOAK"
          mvn failsafe:integration-test failsafe:verify \
            -DskipITs=false \
            -Dnative.image.path="${PWD}/target/condense-runner" \
            -Dcondense.soak.runs="$SOAK" \
            --no-transfer-progress -B

      - name: Enforce uncompressed binary size ceiling
        shell: bash
        run: |
          CEILING=83886080
          BINARY="target/condense-runner${{ matrix.binary_suffix }}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            SIZE=$(stat -f%z "$BINARY")
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            SIZE=$(powershell -NoProfile -Command "(Get-Item '$BINARY').Length")
          else
            SIZE=$(stat -c%s "$BINARY")
          fi
          echo "Uncompressed binary size: $SIZE bytes (ceiling $CEILING = 80 MiB)"
          if [ "$SIZE" -gt "$CEILING" ]; then
            echo "FAIL: uncompressed native image is $SIZE bytes, exceeds ceiling of $CEILING (80 MiB)"
            exit 1
          fi

      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./target/condense-runner --version
          ./target/condense-runner --help
          echo "Binary size: $(du -sh target/condense-runner | cut -f1)"
          ./target/condense-runner git status || true

          # Structural assertion: gain must track commands
          GAIN_JSON=$(./target/condense-runner gain --format json)
          echo "$GAIN_JSON"
          TOTAL=$(echo "$GAIN_JSON" | grep '"total_commands"' | tr -dc '0-9')
          if [ -z "$TOTAL" ] || [ "$TOTAL" -lt 1 ]; then
            echo "FAIL: gain reported total_commands='$TOTAL', expected >= 1"
            echo "Full output: $GAIN_JSON"
            exit 1
          fi
          echo "PASS: gain reports total_commands=$TOTAL"

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\condense-runner.exe --version
          .\target\condense-runner.exe --help
          Write-Host "Binary size: $((Get-Item .\target\condense-runner.exe).Length / 1MB) MB"
          .\target\condense-runner.exe git status

          # Structural assertion: gain must track commands
          $gainJson = .\target\condense-runner.exe gain --format json | Out-String
          Write-Host $gainJson
          $gain = $gainJson | ConvertFrom-Json
          if ($gain.total_commands -lt 1) {
            Write-Error "FAIL: gain reported total_commands=$($gain.total_commands), expected >= 1"
            exit 1
          }
          Write-Host "PASS: gain reports total_commands=$($gain.total_commands)"

      - name: Rename binary
        shell: bash
        run: |
          cp "target/condense-runner${{ matrix.binary_suffix }}" "condense-${{ matrix.target }}${{ matrix.binary_suffix }}"

      - name: Upload artifact for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: condense-${{ matrix.target }}
          path: condense/condense-${{ matrix.target }}${{ matrix.binary_suffix }}
          if-no-files-found: error


  build-deb:
    name: Build .deb Package
    runs-on: ubuntu-latest
    needs: build-native
    defaults:
      run:
        working-directory: condense
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download linux-x64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: condense-linux-x64
          path: condense/target/

      - name: Prepare binary
        run: |
          mv target/condense-linux-x64 target/condense-runner
          chmod +x target/condense-runner

      - name: Install dpkg-dev
        run: sudo apt-get install -y dpkg-dev

      - name: Build .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x packaging/deb/build-deb.sh
          ./packaging/deb/build-deb.sh target/condense-runner "$VERSION" amd64

      - name: Upload .deb for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: condense-deb
          path: condense/condense_*.deb


  publish-release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    needs: [create-release, build-native, build-deb]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./
          format: cyclonedx-json
          output-file: artifacts/sbom.cyclonedx.json

      - name: Assert SBOM lists runtime Maven coordinates
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sbom_path = Path("artifacts/sbom.cyclonedx.json")
          sbom = json.loads(sbom_path.read_text(encoding="utf-8"))
          blob = json.dumps(sbom)
          required = (
              "sqlite-jdbc",
              "jackson-databind",
              "jackson-dataformat-toml",
              "quarkus-picocli",
              "quarkus-arc",
          )
          missing = [name for name in required if name not in blob]
          if missing:
              print("FAIL: CycloneDX SBOM is missing runtime coordinates:", ", ".join(missing))
              sys.exit(1)
          print("PASS: SBOM contains", ", ".join(required))
          PY

      - name: Generate Checksums
        run: |
          cd artifacts
          shopt -s nullglob
          files=(
            condense-linux-x64
            condense-linux-aarch64
            condense-macos-aarch64
            condense-windows-x64.exe
            condense_*.deb
            sbom.cyclonedx.json
          )
          missing=()
          for pattern in "${files[@]}"; do
            if ! ls $pattern >/dev/null 2>&1; then
              missing+=("$pattern")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "FAIL: expected release blobs were missing: ${missing[*]}"
            ls -la
            exit 1
          fi
          sha256sum condense-linux-x64 condense-linux-aarch64 condense-macos-aarch64 condense-windows-x64.exe condense_*.deb sbom.cyclonedx.json > checksums.txt
          cat checksums.txt

      - name: Sign artifacts and checksums
        env:
          COSIGN_YES: true
        run: |
          cd artifacts
          shopt -s nullglob
          for file in condense-linux-x64 condense-linux-aarch64 condense-macos-aarch64 condense-windows-x64.exe condense_*.deb sbom.cyclonedx.json checksums.txt; do
            if [ ! -f "$file" ]; then
              echo "FAIL: cannot sign missing file $file"
              exit 1
            fi
            cosign sign-blob --output-signature "${file}.sig" --output-certificate "${file}.cert" "$file"
          done

      - name: Require a signature for every published blob
        run: |
          cd artifacts
          shopt -s nullglob
          expected=(
            condense-linux-x64
            condense-linux-aarch64
            condense-macos-aarch64
            condense-windows-x64.exe
            sbom.cyclonedx.json
            checksums.txt
          )
          for file in "${expected[@]}" condense_*.deb; do
            if [ ! -f "$file" ]; then
              echo "FAIL: missing published blob $file"
              exit 1
            fi
            if [ ! -f "${file}.sig" ] || [ ! -f "${file}.cert" ]; then
              echo "FAIL: $file is not signed (need ${file}.sig and ${file}.cert)"
              exit 1
            fi
            echo "PASS: $file has checksum coverage and cosign signature"
          done
          if ! grep -q 'condense-linux-x64' checksums.txt; then
            echo "FAIL: checksums.txt does not list condense-linux-x64"
            exit 1
          fi
          if ! grep -q 'sbom.cyclonedx.json' checksums.txt; then
            echo "FAIL: checksums.txt does not list the SBOM"
            exit 1
          fi
          if ! grep -q '\.deb' checksums.txt; then
            echo "FAIL: checksums.txt does not list the .deb"
            exit 1
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
