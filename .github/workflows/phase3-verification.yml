name: Phase 3 Verification

on:
  workflow_dispatch:

jobs:
  native-verification:
    name: Native Verification (Linux x64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: condense

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1.5.6
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install musl toolchain and zlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          curl -L -o zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          mkdir zlib && tar -xzf zlib.tar.gz -C zlib --strip-components 1
          cd zlib
          CC=musl-gcc ./configure --static --prefix=/usr/local/musl
          make
          sudo make install
          echo "C_INCLUDE_PATH=/usr/local/musl/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/usr/local/musl/lib" >> $GITHUB_ENV

      - name: Build native image
        shell: bash
        run: mvn package -Pnative -DskipTests -Dquarkus.native.native-image-xmx=5g --no-transfer-progress -B

      - name: Native integration tests (300-run soak)
        shell: bash
        run: |
          mvn failsafe:integration-test failsafe:verify \
            -DskipITs=false \
            -Dnative.image.path="${PWD}/target/condense-runner" \
            -Dcondense.soak.runs=300 \
            --no-transfer-progress -B
